<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEMODZ — Watch Ad</title>
  <meta name="theme-color" content="#070b10" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    .ad-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .ad-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .ad-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
    }
    .ad-title {
      font-family: var(--pixel);
      font-size: 0.7rem;
      line-height: 1.5;
      letter-spacing: 1px;
      color: var(--accent);
      margin: 0 0 0.85rem;
    }
    .ad-file {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      margin: 0 0 1.25rem;
      word-break: break-all;
    }
    .ad-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 1.5rem 1rem;
      margin-bottom: 1.25rem;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
    }
    .ad-box-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0;
    }
    .ad-timer {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }
    .ad-timer.done {
      color: #f0c14b;
      font-size: 1.1rem;
    }
    .ad-status {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin: 0 0 1.25rem;
    }
    .ad-actions {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .ad-actions .btn {
      width: 100%;
    }
    .ad-actions .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.3);
    }
    .ad-note {
      margin: 1rem 0 0;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="ad-page">
    <div class="ad-card">
      <p class="ad-eyebrow">Free download</p>
      <h1 class="ad-title">Watch a short ad</h1>
      <p class="ad-file" id="ad-file">…</p>

      <div class="ad-box" id="ad-box">
        <p class="ad-box-label">Ad break</p>
        <div class="ad-timer" id="ad-timer">10</div>
        <p class="ad-box-label" id="ad-box-sub">Please wait…</p>
      </div>

      <p class="ad-status" id="ad-status">Your download unlocks after the timer.</p>

      <div class="ad-actions">
        <button type="button" class="btn btn-download" id="ad-continue" disabled>
          Continue to Download
        </button>
        <a class="btn btn-outline" href="main.html">Back to Home</a>
      </div>
      <p class="ad-note">Premium members skip ads with Free to Download.</p>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var WAIT_SECONDS = 10;
      var params = new URLSearchParams(window.location.search);
      var file = params.get("file") || "";
      var label = params.get("label") || file || "Your file";

      var fileEl = document.getElementById("ad-file");
      var timerEl = document.getElementById("ad-timer");
      var statusEl = document.getElementById("ad-status");
      var boxSub = document.getElementById("ad-box-sub");
      var btn = document.getElementById("ad-continue");

      fileEl.textContent = label;

      function goDownload() {
        if (!file) {
          statusEl.textContent = "Missing file. Go back and try again.";
          return;
        }
        var q = "file=" + encodeURIComponent(file);
        if (label && label !== file) q += "&label=" + encodeURIComponent(label);
        window.location.href = "download.html?" + q;
      }

      if (!file) {
        timerEl.textContent = "!";
        timerEl.classList.add("done");
        statusEl.textContent = "No file selected.";
        boxSub.textContent = "Invalid link";
        return;
      }

      var left = WAIT_SECONDS;
      timerEl.textContent = String(left);

      var tick = setInterval(function () {
        left -= 1;
        if (left > 0) {
          timerEl.textContent = String(left);
          return;
        }
        clearInterval(tick);
        timerEl.textContent = "Ready";
        timerEl.classList.add("done");
        boxSub.textContent = "Ad finished";
        statusEl.textContent = "You can continue to your download.";
        btn.disabled = false;
        btn.focus();
      }, 1000);

      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        goDownload();
      });
    })();
  </script>
</body>
</html>
